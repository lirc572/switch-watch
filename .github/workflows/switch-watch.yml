name: switch-watch

on:
  schedule:
    # Twice a day, 01:17 and 13:17 UTC (09:17 and 21:17 SGT).
    - cron: "17 1,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # commit updated state.json, only after notification succeeds
  issues: write # open/update the alert issue
  copilot-requests: write # Copilot CLI with the built-in GITHUB_TOKEN

env:
  LLM_BACKEND: ${{ vars.LLM_BACKEND || 'copilot' }}

concurrency:
  group: switch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install poppler (for PDF T&C parsing)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & test
        run: |
          bun run typecheck
          bun test

      - name: Scan for Nintendo Switch offers
        id: scan
        run: |
          bun run src/run.ts \
            --state data/state.json \
            --out data/state.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report report.json

      - name: Check whether analysis is needed
        id: findings
        run: |
          bun -e '
            import { appendFile } from "node:fs/promises";
            import { analysisCandidates } from "./src/analyze.ts";
            const report = await Bun.file("report.json").json();
            const hasHits = analysisCandidates(report).length > 0;
            await appendFile(process.env.GITHUB_OUTPUT, `has_hits=${hasHits}\n`);
          '

      - uses: actions/setup-node@v4
        if: steps.findings.outputs.has_hits == 'true' && env.LLM_BACKEND == 'copilot'
        with:
          node-version: '22'

      - name: Install Copilot CLI
        if: steps.findings.outputs.has_hits == 'true' && env.LLM_BACKEND == 'copilot'
        continue-on-error: true # analyze.ts records CLI failures as unverified
        run: npm install --global @github/copilot@1.0.86

      - name: Analyze new findings
        if: steps.findings.outputs.has_hits == 'true' && env.LLM_BACKEND != 'off'
        continue-on-error: true # raw candidates must survive analysis failures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional override only when using another user's Copilot seat.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          COPILOT_MAX_AI_CREDITS: ${{ vars.COPILOT_MAX_AI_CREDITS }}
          # Retain the existing OpenAI-compatible backend as an explicit option.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          bun run src/analyze.ts report.json \
            --out report.json \
            --summary llm-summary.md
          cat llm-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update alert issue
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run src/notify.ts report.json

      - name: Commit updated state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore(state): update watch hashes [skip ci]"
          git push
